# electron-builder 打包配置（docs/10 §10）：NSIS 安装包，后端 jar 走 extraResources。
# 打包产物结构需与 desktop/main/index.js 的 loadBackendJarPath/loadFrontend 保持一致：
#   - 前端 → app.asar/frontend/dist（对应 loadFile 的相对路径）
#   - 后端 jar → resources/backend/trailmind-backend-0.0.1.jar（对应 process.resourcesPath）
appId: com.trailmind.app
productName: 思迹 TrailMind

directories:
  output: ../release

files:
  - main/**/*
  - preload/**/*
  - package.json
  - from: ../frontend/dist
    to: frontend/dist

extraResources:
  - from: ../backend/target/trailmind-backend-0.0.1.jar
    to: backend/trailmind-backend-0.0.1.jar

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: TrailMind-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 思迹 TrailMind
