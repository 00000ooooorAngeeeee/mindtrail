server:
  port: 17860
  address: 127.0.0.1   # 仅回环，安全边界 N6

spring:
  application:
    name: trailmind-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/trailmind?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always               # 每次启动执行 schema.sql（CREATE TABLE IF NOT EXISTS 幂等）
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
